name: sync-posts

# Refreshes js/posts.js from the Hashnode RSS feed.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/sync_posts.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- js/posts.js; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/posts.js
          git commit -m "chore: sync latest Hashnode posts"
          git push
